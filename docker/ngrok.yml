# ngrok tunnel config (REQ-CN-001).
# Maps the app service to a public HTTPS URL that GitHub webhooks can reach.
# The webhook URL registered on GitHub is re-pointed at this URL on change.

version: "3"
agent:
  # REQ-CN-001: bind the agent web API on all interfaces so the app container
  # can discover the tunnel's current public URL at http://ngrok:4040.
  web_addr: 0.0.0.0:4040
tunnels:
  webhook:
    proto: http
    addr: app:8080
    inspect: false
